[workspace]
members = ["programs/*"]
resolver = "2"

# SBF cargo is 1.84 and cannot parse edition 2024.
# Locked on purpose: blake3 1.5.5, zeroize 1.8.1, zeroize_derive 1.4.2,
# proc-macro-crate 3.2.0, indexmap 2.6.0.

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
